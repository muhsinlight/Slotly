name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  JAVA_VERSION: '25'
  NODE_VERSION: '24'

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: slotly_test
          POSTGRES_USER: slotly
          POSTGRES_PASSWORD: slotly
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U slotly -d slotly_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: jdbc:postgresql://localhost:5432/slotly_test
      TEST_DATABASE_USERNAME: slotly
      TEST_DATABASE_PASSWORD: slotly
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Run tests
        run: ./mvnw --batch-mode --no-transfer-progress verify

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Verify isolated backup restore
        run: node verify-restore.mjs ${{ job.services.postgres.id }}

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check and build
        run: pnpm run build

  browser:
    name: Browser flows
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: slotly_browser_test
          POSTGRES_USER: slotly
          POSTGRES_PASSWORD: slotly
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U slotly -d slotly_browser_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      E2E_DATABASE_URL: jdbc:postgresql://127.0.0.1:5432/slotly_browser_test
      E2E_DATABASE_USERNAME: slotly
      E2E_DATABASE_PASSWORD: slotly
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Package API
        working-directory: backend
        run: ./mvnw --batch-mode --no-transfer-progress -DskipTests package

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        working-directory: frontend
        run: pnpm exec playwright install --with-deps chromium

      - name: Run browser flows
        working-directory: frontend
        run: pnpm run test:e2e

      - name: Upload failure report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-failure-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7
          if-no-files-found: ignore
