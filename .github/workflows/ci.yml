name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: slotly_test
          POSTGRES_USER: slotly
          POSTGRES_PASSWORD: slotly
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U slotly -d slotly_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: jdbc:postgresql://localhost:5432/slotly_test
      TEST_DATABASE_USERNAME: slotly
      TEST_DATABASE_PASSWORD: slotly
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Run backend tests
        working-directory: backend
        run: ./mvnw --batch-mode verify
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify isolated backup restore
        working-directory: backend
        run: node verify-restore.mjs ${{ job.services.postgres.id }}

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.3.4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Type check and build
        working-directory: frontend
        run: pnpm run build

  browser:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: slotly_browser_test
          POSTGRES_USER: slotly
          POSTGRES_PASSWORD: slotly
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U slotly -d slotly_browser_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      E2E_DATABASE_URL: jdbc:postgresql://127.0.0.1:5432/slotly_browser_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - uses: pnpm/action-setup@v4
        with:
          version: 12.3.4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Package test API
        working-directory: backend
        run: ./mvnw --batch-mode -DskipTests package
      - name: Install frontend and browser
        working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium
      - name: Run browser flows
        working-directory: frontend
        run: pnpm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failure-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7
