spring.application.name=slotly-api
server.port=${SERVER_PORT:8080}
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/slotly}
spring.datasource.username=${DATABASE_USERNAME:slotly}
spring.datasource.password=${DATABASE_PASSWORD:slotly}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
management.endpoints.web.exposure.include=health,info
slotly.jwt.secret=${JWT_SECRET:local-development-signing-secret-change-this-32-bytes-minimum}
slotly.business.time-zone=${BUSINESS_TIME_ZONE:Europe/Istanbul}
