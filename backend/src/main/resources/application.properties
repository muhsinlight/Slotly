spring.application.name=slotly-api
server.port=${SERVER_PORT:8080}
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/slotly}
spring.datasource.username=${DATABASE_USERNAME:slotly}
spring.datasource.password=${DATABASE_PASSWORD:slotly}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.baseline-description=Existing Hibernate schema
spring.flyway.validate-on-migrate=true
slotly.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
slotly.auth.rate-limit.max-attempts=${LOGIN_RATE_LIMIT_ATTEMPTS:10}
slotly.auth.rate-limit.window-seconds=${LOGIN_RATE_LIMIT_WINDOW_SECONDS:60}
server.error.include-message=never
management.endpoint.health.show-details=never
management.endpoints.web.exposure.include=health,info
slotly.jwt.secret=${JWT_SECRET:local-development-signing-secret-change-this-32-bytes-minimum}
slotly.business.time-zone=${BUSINESS_TIME_ZONE:Europe/Istanbul}
spring.main.banner-mode=off
