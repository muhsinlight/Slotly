name: slotly-integration-test

services:
  postgres-test:
    image: postgres:17-alpine
    container_name: slotly-integration-test-postgres
    environment:
      POSTGRES_DB: slotly_test
      POSTGRES_USER: slotly
      POSTGRES_PASSWORD: slotly
    ports:
      - "127.0.0.1:5433:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U slotly -d slotly_test"]
      interval: 2s
      timeout: 3s
      retries: 20
