services:
  postgres:
    image: postgres:17-alpine
    container_name: slotly-postgres
    environment:
      POSTGRES_DB: slotly
      POSTGRES_USER: slotly
      POSTGRES_PASSWORD: slotly
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - slotly-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U slotly -d slotly"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:4-management-alpine
    profiles: ["messaging"]
    environment:
      RABBITMQ_DEFAULT_USER: slotly
      RABBITMQ_DEFAULT_PASS: slotly
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    profiles: ["app"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SERVER_PORT: "8080"
      DATABASE_URL: jdbc:postgresql://postgres:5432/slotly
      DATABASE_USERNAME: slotly
      DATABASE_PASSWORD: slotly
      CORS_ALLOWED_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
      FRONTEND_URL: http://localhost:5173
      BUSINESS_TIME_ZONE: Europe/Istanbul
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 20

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: http://localhost:8080
    profiles: ["app"]
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:5173:80"

volumes:
  slotly-postgres-data:
