services:
  postgres:
    image: postgres:17-alpine
    container_name: slotly-postgres
    environment:
      POSTGRES_DB: slotly
      POSTGRES_USER: slotly
      POSTGRES_PASSWORD: slotly
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - slotly-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U slotly -d slotly"]
      interval: 5s
      timeout: 3s
      retries: 10
  rabbitmq:
    image: rabbitmq:4-management-alpine
    profiles: ["messaging"]
    environment:
      RABBITMQ_DEFAULT_USER: slotly
      RABBITMQ_DEFAULT_PASS: slotly
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  slotly-postgres-data:
