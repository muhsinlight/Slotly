name: slotly-demo
services:
  postgres-demo:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: slotly_demo
      POSTGRES_USER: slotly
      POSTGRES_PASSWORD: slotly_demo
    ports:
      - "127.0.0.1:5435:5432"
    volumes:
      - demo-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U slotly -d slotly_demo"]
      interval: 2s
      timeout: 3s
      retries: 20

  backend-demo:
    build:
      context: ../backend
    profiles: ["app"]
    depends_on:
      postgres-demo:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: demo
      SERVER_PORT: "8082"
      DATABASE_URL: jdbc:postgresql://postgres-demo:5432/slotly_demo
      DATABASE_USERNAME: slotly
      DATABASE_PASSWORD: slotly_demo
      CORS_ALLOWED_ORIGINS: http://localhost:5174,http://127.0.0.1:5174
      FRONTEND_URL: http://localhost:5174
      BUSINESS_TIME_ZONE: Europe/Istanbul
    ports:
      - "127.0.0.1:8082:8082"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8082/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 20

  frontend-demo:
    build:
      context: ../frontend
      args:
        VITE_API_BASE_URL: http://localhost:8082
    profiles: ["app"]
    depends_on:
      backend-demo:
        condition: service_healthy
    ports:
      - "127.0.0.1:5174:80"

volumes:
  demo-data:
