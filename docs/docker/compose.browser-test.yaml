name: slotly-browser-test

services:
  postgres-browser:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: slotly_browser_test
      POSTGRES_USER: slotly
      POSTGRES_PASSWORD: slotly
    ports:
      - "127.0.0.1:5434:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U slotly -d slotly_browser_test"]
      interval: 2s
      timeout: 3s
      retries: 20
